name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    # OrdersService.Api.Tests / InventoryService.Api.Tests spin up their own Postgres via
    # Testcontainers (see PostgresContainerFixture in each project) and apply migrations
    # against it themselves — the runner just needs a Docker daemon, which ubuntu-latest
    # already provides. The workflow doesn't need to know these services use a database.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ServiceHealthDashboard.sln

      - name: Build
        run: dotnet build ServiceHealthDashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ServiceHealthDashboard.sln --configuration Release --no-build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - service: orders-service
            dockerfile: src/OrdersService/OrdersService.Api/Dockerfile
          - service: inventory-service
            dockerfile: src/InventoryService/InventoryService.Api/Dockerfile
          - service: notifications-service
            dockerfile: src/NotificationsService/NotificationsService.Api/Dockerfile
          - service: dashboard-service
            dockerfile: src/DashboardService/DashboardService.Api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Build only — not pushed anywhere yet. This just catches a broken
      # Dockerfile (missing COPY path, failed npm/dotnet build inside the
      # image, etc.) on every push/PR, same as the test job catches broken code.
      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.service }}:ci \
            .

  docker-publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    # Push only on master, never on a pull_request — GITHUB_TOKEN on a PR from a fork has no
    # package-write permission anyway, and a PR shouldn't publish an image regardless. This is
    # the whole CD story: publish an image GitHub Actions can build and validate. It stops
    # there — see README, "Pulling published images", for why auto-deploy to a local minikube
    # cluster from a GitHub-hosted runner isn't something this repo pretends to have.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: orders-service
            dockerfile: src/OrdersService/OrdersService.Api/Dockerfile
          - service: inventory-service
            dockerfile: src/InventoryService/InventoryService.Api/Dockerfile
          - service: notifications-service
            dockerfile: src/NotificationsService/NotificationsService.Api/Dockerfile
          - service: dashboard-service
            dockerfile: src/DashboardService/DashboardService.Api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR image paths must be all-lowercase; github.repository_owner preserves the account's
      # actual casing (ShineIB), which docker/build-push-action would otherwise reject.
      - name: Compute image metadata
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same GIT_SHA/BUILD_TIME build args as the local `docker build` commands in README, so a
      # published image's /version endpoint shows a real commit and build time, not "unknown" —
      # see the Dockerfile comments for why these aren't cache keys.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.service }}:${{ steps.meta.outputs.git_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.service }}:latest

  notify-on-failure:
    name: File an issue for a red master
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, docker-publish]
    # failure() is true only if a needed job actually failed (not skipped) — restricting to
    # push+master on top of that means a PR's red run (which skips docker-publish by design,
    # not a failure) never files anything. There's no GitHub API for the personal "email me on
    # failed Actions" account preference, so this is the closest thing that's actually
    # automatable: an open issue is something a repo visitor sees on the repo home page, the
    # same way a red README badge is supposed to be — belt-and-suspenders for exactly the
    # "two failed pushes went unnoticed" gap this was added to close.
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      issues: write
    steps:
      - name: Open an issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed on master (${context.sha.substring(0, 7)})`,
              body: [
                "The CI workflow failed on a push to `master`.",
                "",
                `**Commit:** ${context.sha}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Close this once master is green again."
              ].join("\n"),
              labels: ["ci-failure"]
            });
