services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders-service:
    build:
      context: .
      dockerfile: src/OrdersService/OrdersService.Api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8080:8080"
    environment:
      Infrastructure__ConnectionString: "Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders"
      Database__RunMigrationsOnStartup: "true"
      InventoryClient__BaseUrl: "http://inventory-service:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started

  inventory-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/InventoryService.Api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8081:8080"
    environment:
      Infrastructure__ConnectionString: "Host=inventory-postgres;Port=5432;Database=inventory;Username=inventory;Password=inventory"
      Database__RunMigrationsOnStartup: "true"
    depends_on:
      inventory-postgres:
        condition: service_healthy

  dashboard-service:
    build:
      context: .
      dockerfile: src/DashboardService/DashboardService.Api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8082:8080"
    environment:
      MonitoredServices__Services__0__Name: "orders-service"
      MonitoredServices__Services__0__BaseUrl: "http://orders-service:8080"
      MonitoredServices__Services__1__Name: "inventory-service"
      MonitoredServices__Services__1__BaseUrl: "http://inventory-service:8080"
    depends_on:
      - orders-service
      - inventory-service

volumes:
  orders-postgres-data:
  inventory-postgres-data:
