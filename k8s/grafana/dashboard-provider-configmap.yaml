# The provider config itself (this file) and the dashboard JSON it points at
# (dashboard-configmap.yaml) are two separate ConfigMaps deliberately — this one just tells
# Grafana "load whatever *.json files show up in this directory," so it never needs to change
# when the dashboard content does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: service-health-dashboard
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: service-health-dashboard
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
