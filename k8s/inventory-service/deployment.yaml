apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: service-health-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: Database__RunMigrationsOnStartup
              value: "false"
            # Read directly by the OTel SDK — no typed options class needed for a standard,
            # spec-defined OTel env var. See k8s/jaeger and CLAUDE.md.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
          envFrom:
            - secretRef:
                name: inventory-service-secret
          # See orders-service/deployment.yaml for the reasoning behind these numbers —
          # same budget, same trade-offs, same app shape (minimal API + EF Core).
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
