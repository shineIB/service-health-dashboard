# See the equivalent comment in orders-service/postgres-deployment.yaml —
# same reasoning: Deployment+PVC over StatefulSet/operator, Recreate strategy
# because the PVC is ReadWriteOnce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-postgres
  namespace: service-health-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-postgres
  template:
    metadata:
      labels:
        app: inventory-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: inventory-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-postgres-pvc
