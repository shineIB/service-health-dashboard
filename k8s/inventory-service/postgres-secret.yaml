# Se motsvarande kommentar i orders-service/postgres-secret.yaml — samma
# medvetna förenkling, samma produktionsrekommendation.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-postgres-secret
  namespace: service-health-dashboard
type: Opaque
stringData:
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: inventory
