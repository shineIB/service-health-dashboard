# NodePort so the UI is reachable the same way as orders-service/dashboard-service (`minikube
# service jaeger -n service-health-dashboard`). The OTLP ports get NodePort'd too as a side
# effect of that — harmless, since the three services reach Jaeger in-cluster via the
# ClusterIP that every Service gets regardless of type, at http://jaeger:4317.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: service-health-dashboard
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
