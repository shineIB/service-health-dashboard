# No Secret, no PVC, no migration Job: notifications-service has no database of its own — it
# only consumes order events from RabbitMQ. RabbitMq__Password is "guest" (RabbitMQ's own
# dev-only default), no more sensitive here than orders-service's copy of the same value —
# same "plain env var, not a Secret" call as dashboard-service's MonitoredServices__* URLs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: service-health-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
      annotations:
        # Picked up by Prometheus's kubernetes_sd_configs (k8s/prometheus/configmap.yaml) on
        # the next pod restart — no separate target list to keep in sync with this Deployment.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: notifications-service
          image: notifications-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RabbitMq__HostName
              value: "rabbitmq"
            - name: RabbitMq__UserName
              value: "guest"
            - name: RabbitMq__Password
              value: "guest"
            # Read directly by the OTel SDK — no typed options class needed for a standard,
            # spec-defined OTel env var. See k8s/jaeger and CLAUDE.md.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
          # Same shape as orders-service/inventory-service/dashboard-service's probes (see
          # orders-service/deployment.yaml for the reasoning behind the numbers). Unlike
          # dashboard-service, /health/ready here IS meaningful on its own — RabbitMqHealthCheck
          # reflects OrderEventConsumer's actual connection state (see CLAUDE.md, step 7).
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
