# Medveten förenkling för lokal minikube-körning: lokala dev-värden i klartext
# i ett vanligt Secret-manifest (base64, inte krypterat — checkas in i Git här
# bara för att det här är ett engångs-dev-lösenord, aldrig ett riktigt).
# I produktion: SOPS, Sealed Secrets eller External Secrets Operator istället
# för att checka in värden (krypterade eller ej) direkt i Git.
apiVersion: v1
kind: Secret
metadata:
  name: orders-postgres-secret
  namespace: service-health-dashboard
type: Opaque
stringData:
  POSTGRES_DB: orders
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orders
