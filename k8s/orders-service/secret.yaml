# Samma medvetna förenkling som postgres-secret.yaml: lokala dev-värden i
# klartext. Produktion: SOPS / Sealed Secrets / External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secret
  namespace: service-health-dashboard
type: Opaque
stringData:
  Infrastructure__ConnectionString: "Host=orders-postgres;Port=5432;Database=orders;Username=orders;Password=orders"
