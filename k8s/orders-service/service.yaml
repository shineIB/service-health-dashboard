# NodePort, not ClusterIP: this is the one service meant to be reached from
# outside the cluster (via `minikube service orders-service -n
# service-health-dashboard`). inventory-service and both Postgres Services stay
# ClusterIP — internal-only, nothing outside the cluster should call them directly.
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: service-health-dashboard
spec:
  type: NodePort
  selector:
    app: orders-service
  ports:
    - port: 8080
      targetPort: 8080
