# No PVC: same avvägning as Jaeger/Prometheus/Grafana — a single local dev instance tolerates
# losing queue state on a pod restart. Every reservation and every order-lifecycle event is
# re-derivable from the services that produced it, not the source of truth itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: service-health-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          ports:
            - containerPort: 5672  # AMQP — what orders-service/notifications-service connect to
            - containerPort: 15672 # Management UI
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            failureThreshold: 3
